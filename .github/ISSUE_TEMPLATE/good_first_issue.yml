name: Good first issue
description: Propose a small, well-scoped task for new contributors.
title: "Good first issue: "
labels:
  - good first issue
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What should be changed?
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Likely files
      description: Point new contributors toward the relevant files or tests.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: What should be true when the issue is complete?
      placeholder: |
        - Tests cover ...
        - README says ...
        - `npm run verify` passes
    validations:
      required: true
