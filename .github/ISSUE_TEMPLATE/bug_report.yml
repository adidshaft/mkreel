name: Bug report
description: Report a reproducible problem with mkreel.
title: "Bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the command you ran and the smallest useful example.
      placeholder: |
        1. Run `mkreel ...`
        2. Choose ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste concise output. Use `--debug` if it helps, but redact private data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mkreel version
      placeholder: "0.1.2"
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v22.12.0"
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 15, Ubuntu 24.04, Windows 11"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI prompts and flags
        - Downloading
        - ffmpeg rendering
        - Subtitles and captions
        - AI suggestions
        - Output naming
        - Package/install
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, private URLs, cookies, and unrelated local paths from this report.
          required: true
